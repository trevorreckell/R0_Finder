name: Build Cross-Platform Executables

on:
  # This allows you to trigger the build manually from the GitHub website
  workflow_dispatch:
  # This triggers a new build automatically every time you upload new code to 'main'
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # These are the three operating systems GitHub will boot up
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linux UI Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Install Python Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build Standalone Executable
      # --onefile creates a single app file. --windowed hides the terminal console.
      run: pyinstaller --noconfirm --onefile --windowed --name "R0_Finder" R0_finder.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: R0_Finder-${{ runner.os }}
        path: |
          dist/*.exe
          dist/*.app
          dist/R0_Finder
        if-no-files-found: warn
